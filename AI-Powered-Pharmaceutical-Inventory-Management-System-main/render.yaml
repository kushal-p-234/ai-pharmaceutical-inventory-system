services:
  - type: web
    name: pharma-inventory
    env: python
    buildCommand: pip install -r requirements-lite.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DISABLE_HEAVY_FEATURES
        value: "true"  # Set to false to enable TensorFlow/deep learning


